<!DOCTYPE html>
<html>

<head>
    <title>Customers - Retail Shop</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        nav {
            background: #1f2937;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            font-size: 22px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 40px;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            color: #6b7280;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            margin-bottom: 30px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: end;
        }

        .input-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 220px;
            padding: 12px;

            border: 1px solid #d1d5db;
            border-radius: 8px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            padding: 12px 22px;
            border: none;
            border-radius: 8px;

            background: #2563eb;
            color: white;

            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f3f4f6;
            text-align: left;
            padding: 15px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f9fafb;
        }

    </style>
</head>

<body>

    <nav>

        <h2>🛍️ Retail Shop</h2>

        <div>
            <a href="/index.html">Dashboard</a>
            <a href="/products.html">Products</a>
            <a href="/customers.html">Customers</a>
            <a href="/orders.html">Orders</a>
        </div>

    </nav>


    <main>

        <div class="header">

            <h1>Customers</h1>

            <p>Manage your shop customers</p>

        </div>


        <!-- ADD CUSTOMER -->

        <div class="card">

            <h2>➕ Add Customer</h2>

            <form id="customerForm">

                <div class="input-box">

                    <label>Name</label>

                    <input
                        type="text"
                        id="customerName"
                        placeholder="Customer name"
                        minlength="2"
                        maxlength="50"
                        required
                    >

                </div>


                <div class="input-box">

                    <label>Phone</label>

                    <input
                        type="tel"
                        id="customerPhone"
                        placeholder="10 digit phone"
                        minlength="10"
                        maxlength="15"
                        pattern="[0-9]{10,15}"
                        required
                    >

                </div>


                <div class="input-box">

                    <label>Email</label>

                    <input
                        type="email"
                        id="customerEmail"
                        placeholder="example@gmail.com"
                    >

                </div>


                <div class="input-box">

                    <label>Address</label>

                    <input
                        type="text"
                        id="customerAddress"
                        placeholder="Customer address"
                        maxlength="200"
                    >

                </div>


                <button type="submit">
                    Add Customer
                </button>

            </form>

        </div>


        <!-- CUSTOMER LIST -->

        <div class="card">

            <h2>👥 Customer List</h2>

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Address</th>
                    </tr>

                </thead>

                <tbody id="customerTable">
                </tbody>

            </table>

        </div>

    </main>


    <script src="/app.js"></script>

</body>

</html>
